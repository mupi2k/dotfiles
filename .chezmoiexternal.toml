# Externally-managed git repos — cloned/updated by chezmoi apply.
# Replaces git submodules so the dotfiles repo stays clean.

[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "git@github.com:tmux-plugins/tpm.git"
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-resurrect"]
    type = "git-repo"
    url = "git@github.com:tmux-plugins/tmux-resurrect.git"
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-continuum"]
    type = "git-repo"
    url = "git@github.com:tmux-plugins/tmux-continuum.git"
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-fzf-links"]
    type = "git-repo"
    url = "git@github.com:alberti42/tmux-fzf-links.git"
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-powerline"]
    type = "git-repo"
    url = "git@github.com:erikw/tmux-powerline.git"
    refreshPeriod = "168h"

[".zsh/zsh-autosuggestions"]
    type = "git-repo"
    url = "git@github.com:zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"
